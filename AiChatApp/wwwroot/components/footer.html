<footer id="global-footer" class="fixed bottom-16 md:bottom-0 left-0 right-0 md:left-[260px] p-4 md:p-6 bg-gradient-to-t from-base-100 via-base-100 to-transparent z-[100] pointer-events-none" style="display:none">
    <div class="max-w-3xl mx-auto relative pointer-events-auto">
        <form id="chat-form" onsubmit="handleFormSubmit(event); return false;" class="input-container relative bg-base-200 rounded-[24px] shadow-2xl border border-base-300 transition-all focus-within:border-primary/50 flex flex-col p-2">
            <div id="project-context-banner" class="hidden flex items-center justify-between px-3 py-1.5 bg-secondary/10 border-b border-secondary/20 rounded-t-[20px] -mb-1 mx-0.5"><div class="flex items-center gap-1.5"><span class="text-[11px] font-semibold text-secondary opacity-80" id="project-banner-name"></span></div><button type="button" onclick="deselectProject()" class="text-[10px] opacity-40 hover:opacity-70 transition-opacity">✕ clear</button></div>
            <input type="hidden" name="sessionId" id="session-id-input" /><input type="hidden" name="projectId" id="project-id-input" /><input type="hidden" name="agentId" id="selected-agent-id-input" />
            <input type="hidden" name="attachmentIds" id="attachment-ids-input" />
            <div id="provider-selector-container" class="flex items-center justify-between px-3 pt-1 pb-1 border-b border-base-content/5 mb-1">
                <div class="flex items-center gap-2">
                    <select name="provider" onchange="changeSessionProvider(this.value)" class="select select-ghost select-xs opacity-60 font-semibold">
                        <option value="antigravity" selected>Antigravity</option>
                        <option value="copilot">GitHub Copilot</option>
                        <option value="claude">Claude Code</option>
                        <option value="codex">Codex</option>
                        <option value="opencode">OpenCode</option>
                        <option value="lmstudio">LM Studio</option>
                    </select>
                    <div class="flex items-center gap-1.5 ml-2">
                        <input type="checkbox" id="stream-toggle" class="checkbox checkbox-xs checkbox-primary" checked onchange="saveStreamPreference(this.checked)" />
                        <label for="stream-toggle" class="text-[10px] font-bold opacity-40 cursor-pointer uppercase">Stream</label>
                    </div>
                    <div class="flex items-center gap-1.5 ml-2">
                        <input type="checkbox" id="plan-mode-toggle" class="checkbox checkbox-xs checkbox-warning" onchange="onPlanModeToggle(this.checked)" />
                        <label for="plan-mode-toggle" class="text-[10px] font-bold opacity-40 cursor-pointer uppercase text-warning">Plan</label>
                    </div>
                </div>
                <input type="hidden" name="mode" id="mode-input" value="" />
                <input type="hidden" name="processType" id="process-type-input" value="hierarchical" />
            </div>
            <div id="project-agent-selector" class="flex items-center gap-2 px-3 py-1.5 overflow-x-auto no-scrollbar border-b border-base-content/5 hidden"><span class="text-[9px] font-bold opacity-30 uppercase">Agent:</span><div id="project-agent-chips" class="flex items-center gap-1.5"></div><div class="ml-auto flex items-center gap-1 shrink-0"><span class="text-[9px] font-bold opacity-30 uppercase">Process:</span><button type="button" id="process-toggle-btn" onclick="toggleProcessType()" class="badge badge-xs badge-outline opacity-60 hover:opacity-100 cursor-pointer" title="Toggle Sequential/Hierarchical">Hierarchical</button></div></div>
            <!-- Attachment preview strip -->
            <div id="attachment-preview" class="hidden flex flex-wrap gap-2 px-3 py-2 border-b border-base-content/5"></div>
            <div class="flex items-end gap-2 w-full">
                <!-- Integrated action menu (dropdown) -->
                <div class="dropdown dropdown-top dropdown-start mb-1 z-[110]">
                    <div tabindex="0" role="button" class="btn btn-ghost btn-sm btn-circle opacity-60 hover:opacity-100" title="More options">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                    </div>
                    <ul tabindex="0" class="dropdown-content menu p-2 shadow-2xl bg-base-200 border border-base-300 rounded-box w-40 gap-1 z-[200]">
                        <li>
                            <a onclick="document.getElementById('file-upload-input').click(); document.activeElement.blur();" class="flex items-center gap-2 py-2">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.112 2.13" /></svg>
                                <span data-i18n="attach-file">上传文件</span>
                            </a>
                        </li>
                        <li>
                            <a onclick="document.getElementById('history-modal').showModal(); htmx.trigger('body', 'refreshHistory'); document.activeElement.blur();" class="flex items-center gap-2 py-2">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
                                <span data-i18n="history">历史记录</span>
                            </a>
                        </li>
                    </ul>
                </div>
                <input type="file" id="file-upload-input" multiple accept="*/*" class="hidden" onchange="handleFileSelect(this.files)" />
                <textarea name="content" id="chat-input" data-i18n="input-placeholder" class="textarea textarea-ghost focus:bg-transparent focus:outline-none w-full py-3 leading-relaxed text-base min-h-[44px] max-h-[30vh] overflow-y-auto resize-none" autocomplete="off" oninput="autoExpand(this)" onkeydown="if(event.ctrlKey&&event.keyCode==13){handleFormSubmit(event);return false;}"></textarea><button type="submit" class="btn btn-circle btn-primary btn-sm md:btn-md shadow-lg shrink-0" id="send-btn"><span id="loading-spinner" class="loading loading-spinner loading-xs hidden" aria-hidden="true"></span><svg xmlns="http://www.w3.org/2000/svg" class="send-icon h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg></button></div>
        </form>
    </div>
</footer>
