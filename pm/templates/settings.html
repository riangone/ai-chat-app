<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 — Photo Manager</title>
    <link href="/pm/static/css/daisyui.min.css" rel="stylesheet" />
    <script src="/pm/static/js/tailwind-cdn.js"></script>
</head>
<body class="bg-base-200 min-h-screen">

<!-- Navbar -->
<div class="navbar bg-base-100 shadow-md sticky top-0 z-30 px-4">
    <div class="flex-1">
        <a href="/pm/" class="text-lg font-bold">📷 Photo Manager</a>
    </div>
    <div class="flex-none gap-2 items-center">
        <span class="text-sm text-base-content/50 hidden sm:inline">{{ username }}</span>
        <form method="post" action="/pm/logout">
            <button type="submit" class="btn btn-ghost btn-sm text-error">退出登录</button>
        </form>
    </div>
</div>

<main class="container mx-auto p-4 sm:p-8 max-w-lg">
    <h1 class="text-2xl font-bold mb-6">账户设置</h1>

    <div class="card bg-base-100 shadow">
        <div class="card-body">
            <h2 class="card-title text-base mb-4">修改密码</h2>

            {% if success %}
            <div class="alert alert-success mb-4">
                <span>✓ 密码已成功修改</span>
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-error mb-4">
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="post" action="/pm/api/settings/change-password" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text">当前密码</span></label>
                    <input type="password" name="current_password" class="input input-bordered w-full" required />
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">新密码</span></label>
                    <input type="password" name="new_password" class="input input-bordered w-full" required />
                    <label class="label"><span class="label-text-alt text-base-content/50">至少 8 个字符</span></label>
                </div>
                <div class="form-control">
                    <label class="label"><span class="label-text">确认新密码</span></label>
                    <input type="password" name="confirm_password" class="input input-bordered w-full" required />
                </div>
                <div class="form-control mt-2">
                    <button type="submit" class="btn btn-primary w-full">保存修改</button>
                </div>
            </form>
        </div>
    </div>

    <div class="mt-4">
        <a href="/pm/" class="btn btn-ghost btn-sm">← 返回相册</a>
    </div>
</main>
</body>
</html>
